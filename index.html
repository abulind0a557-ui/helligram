<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0e1621; color: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header { background: #17212b; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0b1017; }
        .header h2 { font-size: 18px; color: #fff; }
        .online-badge { font-size: 13px; color: #6ab2f2; }

        /* Chat Area */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #182533; border-bottom-left-radius: 2px; }
        .msg-user { font-size: 12px; font-weight: bold; color: #6ab2f2; margin-bottom: 3px; }
        .msg-time { font-size: 10px; color: #8c9ba5; text-align: right; margin-top: 4px; }
        .system-msg { align-self: center; background: #182533; color: #8c9ba5; font-size: 12px; padding: 4px 12px; border-radius: 12px; }

        /* Input Area */
        .input-area { background: #17212b; padding: 10px 15px; display: flex; gap: 10px; }
        #msgInput { flex: 1; background: #242f3d; border: none; color: #fff; padding: 12px 15px; border-radius: 20px; font-size: 15px; outline: none; }
        #sendBtn { background: #5288c1; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #sendBtn:hover { background: #4676a8; }

        /* Login Overlay */
        #loginOverlay { position: fixed; inset: 0; background: #0e1621; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .login-box { background: #17212b; padding: 30px; border-radius: 12px; text-align: center; width: 90%; max-width: 340px; }
        .login-box h2 { margin-bottom: 15px; color: #6ab2f2; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; background: #242f3d; color: #fff; font-size: 15px; outline: none; }
        .login-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #5288c1; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>MyChat</h2>
        <input type="text" id="usernameInput" placeholder="Apna naam likhein..." maxlength="20">
        <button onclick="joinChat()">Join Chat</button>
    </div>
</div>

<div class="header">
    <h2>MyChat Lobby</h2>
    <span class="online-badge" id="onlineCount">0 online</span>
</div>

<div id="messages"></div>

<div class="input-area">
    <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
    let ws;
    let myName = "";

    function joinChat() {
        const input = document.getElementById("usernameInput").value.trim();
        if (!input) return alert("Pehle apna naam likhein!");
        myName = input;
        document.getElementById("loginOverlay").style.display = "none";

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/${encodeURIComponent(myName)}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.online !== undefined) {
                document.getElementById("onlineCount").innerText = `${data.online} online`;
            }

            const msgBox = document.getElementById("messages");
            const div = document.createElement("div");

            if (data.type === "system") {
                div.className = "system-msg";
                div.innerText = data.text;
            } else {
                const isMe = data.user === myName;
                div.className = `msg ${isMe ? "me" : "other"}`;
                div.innerHTML = `
                    ${!isMe ? `<div class="msg-user">${data.user}</div>` : ""}
                    <div>${data.text}</div>
                    <div class="msg-time">${data.time}</div>
                `;
            }
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        };
    }

    function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(text);
            input.value = "";
        }
    }
</script>
</body>
</html>
