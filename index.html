<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helligram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0e1621; color: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header { background: #17212b; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0b1017; }
        .header-left h2 { font-size: 18px; color: #fff; }
        .online-badge { font-size: 12px; color: #6ab2f2; }
        .header-actions { display: flex; gap: 8px; }
        .bot-btn { background: #2b5278; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .logout-btn { background: #242f3d; color: #ff6b6b; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }

        /* Chat Area */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #182533; border-bottom-left-radius: 2px; }
        .msg.bot { align-self: flex-start; background: #1c2e3d; border: 1px solid #3d6c99; border-bottom-left-radius: 2px; }
        .msg-user { font-size: 12px; font-weight: bold; color: #6ab2f2; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
        .bot-tag { background: #5288c1; color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.5px; }
        .msg-time { font-size: 10px; color: #8c9ba5; text-align: right; margin-top: 4px; }
        .system-msg { align-self: center; background: #182533; color: #8c9ba5; font-size: 12px; padding: 4px 12px; border-radius: 12px; }

        /* Input Area */
        .input-area { background: #17212b; padding: 10px 15px; display: flex; gap: 10px; }
        #msgInput { flex: 1; background: #242f3d; border: none; color: #fff; padding: 12px 15px; border-radius: 20px; font-size: 15px; outline: none; }
        #sendBtn { background: #5288c1; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Auth & BotFather Modals */
        .overlay { position: fixed; inset: 0; background: rgba(14, 22, 33, 0.92); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .modal-box { background: #17212b; padding: 25px; border-radius: 12px; width: 92%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
        .modal-box h2 { margin-bottom: 15px; color: #6ab2f2; text-align: center; }
        .modal-box input { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 8px; border: none; background: #242f3d; color: #fff; font-size: 14px; outline: none; }
        .primary-btn { width: 100%; padding: 11px; border-radius: 8px; border: none; background: #5288c1; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
        .toggle-text { margin-top: 15px; font-size: 13px; color: #8c9ba5; cursor: pointer; text-align: center; }
        .toggle-text span { color: #6ab2f2; font-weight: bold; }
        .err-text { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; text-align: center; min-height: 16px; }

        /* Bot List */
        .bot-item { background: #242f3d; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .bot-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .bot-name { font-weight: bold; color: #6ab2f2; font-size: 14px; }
        .bot-token { background: #0e1621; padding: 6px; border-radius: 5px; font-family: monospace; font-size: 11px; word-break: break-all; color: #a5d6a7; }
        .small-btn { background: #5288c1; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 6px; margin-right: 5px; }
        .del-btn { background: #c0392b; }
        .close-btn { background: #242f3d; color: #ccc; margin-top: 12px; }
    </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay" class="overlay">
    <div class="modal-box">
        <h2 id="authTitle">Helligram Login</h2>
        <div id="authError" class="err-text"></div>
        <input type="text" id="usernameInput" placeholder="Username" maxlength="20">
        <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') submitAuth()">
        <button id="authBtn" class="primary-btn" onclick="submitAuth()">Login</button>
        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggleLabel">Naya account banana hai? Sign Up</span>
        </div>
    </div>
</div>

<!-- BotFather Modal -->
<div id="botModal" class="overlay" style="display: none;">
    <div class="modal-box">
        <h2>🤖 Helligram BotFather</h2>
        <div id="botError" class="err-text"></div>
        <input type="text" id="newBotName" placeholder="Naye bot ka naam (e.g. helper_bot)">
        <button class="primary-btn" onclick="createBot()">+ Create New Bot</button>
        <div id="botList"></div>
        <button class="primary-btn close-btn" onclick="closeBotModal()">Close</button>
    </div>
</div>

<!-- Main UI -->
<div class="header">
    <div class="header-left">
        <h2>Helligram</h2>
        <span class="online-badge" id="onlineCount">Connecting...</span>
    </div>
    <div class="header-actions">
        <button class="bot-btn" onclick="openBotModal()">🤖 Bots</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div id="messages"></div>

<div class="input-area">
    <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
    let ws;
    let isSignup = false;
    let myName = localStorage.getItem("hg_username") || "";
    let myToken = localStorage.getItem("hg_token") || "";

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
    }

    function toggleMode() {
        isSignup = !isSignup;
        document.getElementById("authTitle").innerText = isSignup ? "Helligram Sign Up" : "Helligram Login";
        document.getElementById("authBtn").innerText = isSignup ? "Create Account" : "Login";
        document.getElementById("toggleLabel").innerText = isSignup ? "Pehle se account hai? Login" : "Naya account banana hai? Sign Up";
        document.getElementById("authError").innerText = "";
    }

    async function submitAuth() {
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const errDiv = document.getElementById("authError");
        errDiv.innerText = "";

        const endpoint = isSignup ? "/api/signup" : "/api/login";
        try {
            const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) { errDiv.innerText = data.detail || "Error aaya hai"; return; }
            myName = data.username;
            myToken = data.token;
            localStorage.setItem("hg_username", myName);
            localStorage.setItem("hg_token", myToken);
            connectWebSocket();
        } catch (e) {
            errDiv.innerText = "Server se connect nahi ho saka.";
        }
    }

    function appendMessage(data) {
        const msgBox = document.getElementById("messages");
        const div = document.createElement("div");
        if (data.type === "system") {
            div.className = "system-msg";
            div.innerText = data.text;
        } else {
            const isMe = !data.is_bot && data.user === myName;
            div.className = `msg ${data.is_bot ? "bot" : (isMe ? "me" : "other")}`;
            const botBadge = data.is_bot ? `<span class="bot-tag">BOT</span>` : "";
            div.innerHTML = `
                ${!isMe ? `<div class="msg-user">${escapeHtml(data.user)} ${botBadge}</div>` : ""}
                <div>${escapeHtml(data.text)}</div>
                <div class="msg-time">${escapeHtml(data.time)}</div>
            `;
        }
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function connectWebSocket() {
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("messages").innerHTML = "";

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/${myToken}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.online !== undefined) {
                document.getElementById("onlineCount").innerText = `${data.online} online`;
            }
            if (data.type === "history") {
                data.messages.forEach(appendMessage);
            } else {
                appendMessage(data);
            }
        };
        ws.onclose = (e) => { if (e.code === 1008) logout(); };
    }

    function sendMessage() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(text);
            input.value = "";
        }
    }

    // --- BOTFATHER FUNCTIONS ---
    async function openBotModal() {
        document.getElementById("botModal").style.display = "flex";
        document.getElementById("botError").innerText = "";
        await loadBots();
    }

    function closeBotModal() {
        document.getElementById("botModal").style.display = "none";
    }

    async function loadBots() {
        const res = await fetch("/api/bots/list", { headers: { "x-auth-token": myToken } });
        const data = await res.json();
        const listDiv = document.getElementById("botList");
        if (!data.bots || data.bots.length === 0) {
            listDiv.innerHTML = `<p style="color:#8c9ba5; font-size:13px; text-align:center; margin-top:15px;">Abhi tak koi bot nahi banaya.</p>`;
            return;
        }
        listDiv.innerHTML = data.bots.map(b => `
            <div class="bot-item">
                <div class="bot-item-header">
                    <span class="bot-name">@${escapeHtml(b.bot_name)}</span>
                </div>
                <div class="bot-token">${escapeHtml(b.token)}</div>
                <button class="small-btn" onclick="copyToken('${escapeHtml(b.token)}')">Copy Token</button>
                <button class="small-btn del-btn" onclick="deleteBot(${b.id})">Delete</button>
            </div>
        `).join("");
    }

    async function createBot() {
        const nameInput = document.getElementById("newBotName");
        const errDiv = document.getElementById("botError");
        errDiv.innerText = "";
        const res = await fetch("/api/bots/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-auth-token": myToken },
            body: JSON.stringify({ bot_name: nameInput.value })
        });
        const data = await res.json();
        if (!res.ok) { errDiv.innerText = data.detail || "Bot create nahi ho saka"; return; }
        nameInput.value = "";
        await loadBots();
    }

    async function deleteBot(id) {
        await fetch(`/api/bots/${id}`, { method: "DELETE", headers: { "x-auth-token": myToken } });
        await loadBots();
    }

    function copyToken(token) {
        navigator.clipboard.writeText(token);
        alert("Bot Token copy ho gaya!");
    }

    function logout() {
        localStorage.removeItem("hg_username");
        localStorage.removeItem("hg_token");
        if (ws) ws.close();
        location.reload();
    }

    if (myToken && myName) connectWebSocket();
</script>
</body>
</html>
