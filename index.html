<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helligram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-main: #0e1621;
            --bg-sidebar: #17212b;
            --bg-elevated: #1e2c3a;
            --bg-hover: #202b36;
            --bg-active: #2b5278;
            --bg-input: #242f3d;
            --msg-in: #182533;
            --msg-out: #2b5278;
            --accent: #5288c1;
            --accent-bright: #6ab2f2;
            --text-main: #f5f5f5;
            --text-muted: #7f91a4;
            --border: #0b1017;
            --danger: #ff595a;
        }

        body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; display: flex; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 10px; }

        svg { display: block; fill: currentColor; }

        /* --- SIDEBAR --- */
        .sidebar { width: 360px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; position: relative; flex-shrink: 0; }

        .sidebar-top { padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; }
        .icon-circle-btn { background: none; border: none; color: var(--text-muted); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s; flex-shrink: 0; }
        .icon-circle-btn:hover { background: var(--bg-hover); color: #fff; }

        .search-wrap { flex: 1; position: relative; }
        .search-wrap input { width: 100%; background: var(--bg-input); border: 1.5px solid transparent; color: #fff; padding: 9px 14px 9px 38px; border-radius: 22px; font-size: 14px; outline: none; transition: 0.2s; }
        .search-wrap input:focus { border-color: var(--accent-bright); background: #192430; }
        .search-wrap input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

        /* Folder Tabs */
        .folder-tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--border); gap: 2px; overflow-x: auto; }
        .folder-tab { flex: 1; text-align: center; padding: 9px 6px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; white-space: nowrap; transition: color 0.15s; user-select: none; }
        .folder-tab:hover { color: #d5e2ee; }
        .folder-tab.active { color: var(--accent-bright); }
        .folder-tab.active::after { content: ""; position: absolute; bottom: 0; left: 16%; right: 16%; height: 3px; background: var(--accent-bright); border-radius: 3px 3px 0 0; }

        .chat-list { flex: 1; overflow-y: auto; padding: 6px 6px 80px; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; }
        .chat-item:hover { background: var(--bg-hover); }
        .chat-item.active { background: var(--bg-active); }
        .chat-item.active .chat-preview, .chat-item.active .chat-time { color: #d6e6f5; }

        .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 18px; flex-shrink: 0; text-transform: uppercase; color: #fff; user-select: none; box-shadow: inset 0 -2px 6px rgba(0,0,0,0.18); }
        .avatar-sm { width: 40px; height: 40px; font-size: 16px; }
        .avatar-lg { width: 76px; height: 76px; font-size: 30px; }

        .chat-info { flex: 1; min-width: 0; }
        .chat-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .chat-name-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
        .chat-name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-type-icon { color: var(--accent-bright); flex-shrink: 0; }
        .chat-item.active .chat-type-icon { color: #fff; }
        .chat-time { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }

        .chat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
        .chat-preview { font-size: 13.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--accent-bright); color: #0e1621; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .section-label { padding: 8px 12px 4px; font-size: 12px; font-weight: 600; color: var(--accent-bright); letter-spacing: 0.3px; }

        /* FAB */
        .fab { position: absolute; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
        .fab:hover { background: #5e97d1; transform: scale(1.06); }
        .fab:active { transform: scale(0.96); }

        /* --- SLIDE-OUT DRAWER --- */
        .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.22s; }
        .backdrop.open { opacity: 1; pointer-events: auto; }

        .drawer { position: fixed; top: 0; left: -300px; width: 285px; height: 100%; background: var(--bg-sidebar); z-index: 31; transition: left 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.55); }
        .drawer.open { left: 0; }
        .drawer-header { padding: 26px 20px 18px; background: linear-gradient(135deg, #1d2d3e 0%, #16212c 100%); border-bottom: 1px solid var(--border); }
        .drawer-user { margin-top: 14px; font-size: 16.5px; font-weight: 600; }
        .drawer-handle { font-size: 13px; color: var(--accent-bright); margin-top: 2px; }
        .drawer-items { padding: 10px 8px; flex: 1; }
        .drawer-item { display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 14.5px; font-weight: 500; color: var(--text-main); transition: background 0.15s; }
        .drawer-item:hover { background: var(--bg-hover); }
        .drawer-item svg { color: var(--text-muted); }
        .drawer-item.danger { color: var(--danger); }
        .drawer-item.danger svg { color: var(--danger); }
        .drawer-footer { padding: 14px 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

        /* --- CHAT PANEL --- */
        .chat-panel {
            flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; min-width: 0;
            background-color: var(--bg-main);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(82, 136, 193, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(106, 178, 242, 0.06) 0%, transparent 45%),
                radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 26px 26px;
        }

        .chat-header { background: var(--bg-sidebar); padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); min-height: 58px; z-index: 5; }
        .chat-header-clickable { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; padding: 3px 6px; border-radius: 8px; transition: background 0.15s; }
        .chat-header-clickable:hover { background: var(--bg-hover); }
        .back-btn { display: none; }
        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-info h3 { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-info span { font-size: 12.5px; color: var(--text-muted); display: block; margin-top: 1px; }

        #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .empty-state { margin: auto; background: rgba(23, 33, 43, 0.88); backdrop-filter: blur(8px); color: #d0dce8; font-size: 14px; padding: 10px 20px; border-radius: 22px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
        .date-pill { align-self: center; background: rgba(23, 33, 43, 0.82); color: #b5c6d6; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 14px; margin: 6px 0 10px; }

        /* Bubbles */
        @keyframes msgPop { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .msg { position: relative; max-width: 68%; padding: 7px 11px 6px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.42; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.28); animation: msgPop 0.16s ease-out; margin-top: 6px; }
        .msg.grouped { margin-top: 1px; }
        .msg.me { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; }
        .msg-user { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
        .msg-body { display: inline; white-space: pre-wrap; }
        .msg-meta { float: right; margin-left: 10px; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.52); display: inline-flex; align-items: center; gap: 3px; user-select: none; }
        .msg.me .msg-meta { color: #8ec5f5; }

        /* Floating Emoji Popover */
        .emoji-popover { position: absolute; bottom: 68px; left: 16px; width: 300px; max-width: calc(100% - 32px); background: var(--bg-elevated); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.5); display: none; grid-template-columns: repeat(7, 1fr); gap: 6px; z-index: 15; }
        .emoji-popover.open { display: grid; }
        .emoji-popover span { font-size: 22px; text-align: center; padding: 5px 0; border-radius: 8px; cursor: pointer; transition: background 0.12s, transform 0.12s; user-select: none; }
        .emoji-popover span:hover { background: var(--bg-hover); transform: scale(1.18); }

        /* Input Area */
        .input-area { background: var(--bg-sidebar); padding: 8px 14px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); min-height: 58px; }
        #msgInput { flex: 1; background: var(--bg-input); border: 1.5px solid transparent; color: #fff; padding: 10px 16px; border-radius: 22px; font-size: 14.5px; outline: none; transition: border-color 0.2s; }
        #msgInput:focus { border-color: var(--accent); }
        #msgInput::placeholder { color: var(--text-muted); }
        #sendBtn { background: var(--accent); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.15s; flex-shrink: 0; }
        #sendBtn:hover { background: #5e97d1; }
        #sendBtn:active { transform: scale(0.92); }
        .readonly-bar { width: 100%; text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* --- RIGHT INFO PANEL --- */
        .info-panel { width: 300px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: none; flex-direction: column; height: 100%; flex-shrink: 0; }
        .info-panel.open { display: flex; }
        .info-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 58px; }
        .info-header h3 { font-size: 15.5px; font-weight: 600; }
        .info-body { padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
        .info-title { font-size: 18px; font-weight: 600; margin-top: 4px; }
        .info-sub { font-size: 13px; color: var(--accent-bright); }
        .info-card { width: 100%; background: var(--bg-input); border-radius: 12px; padding: 12px 14px; text-align: left; margin-top: 12px; font-size: 13.5px; color: #d0dce8; line-height: 1.5; }
        .info-card small { display: block; color: var(--text-muted); font-size: 11.5px; margin-bottom: 2px; }

        /* --- MODALS --- */
        .overlay { position: fixed; inset: 0; background: rgba(11, 16, 23, 0.88); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 40; }
        .modal-box { background: var(--bg-sidebar); padding: 28px 24px; border-radius: 16px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.06); }
        .logo-circle { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, #6ab2f2, #3a7bd5); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 6px 18px rgba(82, 136, 193, 0.4); }
        .modal-box h2 { margin-bottom: 14px; color: #fff; font-size: 20px; font-weight: 600; }
        .modal-box input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px; border: 1.5px solid #2b3a4a; background: var(--bg-input); color: #fff; font-size: 14.5px; outline: none; transition: 0.2s; }
        .modal-box input:focus { border-color: var(--accent-bright); }
        .primary-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .primary-btn:hover { background: #5e97d1; }
        .cancel-btn { background: var(--bg-input); color: #ccc; margin-top: 8px; }
        .cancel-btn:hover { background: #2d3b4c; }
        .toggle-text { margin-top: 16px; font-size: 13.5px; color: var(--text-muted); cursor: pointer; }
        .toggle-text span { color: var(--accent-bright); font-weight: 600; }
        .err-text { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #243447; color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: 0.25s; z-index: 60; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .info-panel { position: fixed; right: 0; top: 0; z-index: 25; box-shadow: -6px 0 24px rgba(0,0,0,0.5); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .chat-panel { display: none; width: 100%; }
            body.chat-open .sidebar { display: none; }
            body.chat-open .chat-panel { display: flex; }
            .back-btn { display: inline-flex; }
            #messages { padding: 12px 14px; }
            .msg { max-width: 82%; }
        }
    </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay" class="overlay">
    <div class="modal-box">
        <div class="logo-circle">
            <svg width="32" height="32" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </div>
        <h2 id="authTitle">Helligram</h2>
        <div id="authError" class="err-text"></div>
        <input type="text" id="usernameInput" placeholder="Username" maxlength="20">
        <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') submitAuth()">
        <button id="authBtn" class="primary-btn" onclick="submitAuth()">Sign In</button>
        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggleLabel">Naya account banana hai? Sign Up</span>
        </div>
    </div>
</div>

<!-- Create Group/Channel Modal -->
<div id="createModal" class="overlay" style="display: none;">
    <div class="modal-box">
        <h2 id="createModalTitle">New Group</h2>
        <input type="text" id="newRoomName" placeholder="Naam likhein..." onkeypress="if(event.key==='Enter') confirmCreateRoom()">
        <button class="primary-btn" onclick="confirmCreateRoom()">Create</button>
        <button class="primary-btn cancel-btn" onclick="closeCreateModal()">Cancel</button>
    </div>
</div>

<!-- Slide-out Drawer -->
<div class="backdrop" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="avatar" id="drawerAvatar">H</div>
        <div class="drawer-user" id="drawerName">User</div>
        <div class="drawer-handle" id="drawerHandle">@user</div>
    </div>
    <div class="drawer-items">
        <div class="drawer-item" onclick="toggleDrawer(false); openCreateModal('group')">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            New Group
        </div>
        <div class="drawer-item" onclick="toggleDrawer(false); openCreateModal('channel')">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>
            New Channel
        </div>
        <div class="drawer-item danger" onclick="logout()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            Log Out
        </div>
    </div>
    <div class="drawer-footer">Helligram Web • v2.5</div>
</div>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="sidebar-top">
        <button class="icon-circle-btn" onclick="toggleDrawer(true)" title="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="search-wrap">
            <span class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search" oninput="handleSearch()">
        </div>
    </div>

    <div class="folder-tabs">
        <div class="folder-tab active" onclick="setFolder('all', this)">All</div>
        <div class="folder-tab" onclick="setFolder('dm', this)">Private</div>
        <div class="folder-tab" onclick="setFolder('group', this)">Groups</div>
        <div class="folder-tab" onclick="setFolder('channel', this)">Channels</div>
    </div>

    <div class="chat-list" id="chatList"></div>

    <button class="fab" title="New Group" onclick="openCreateModal('group')">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
</div>

<!-- Center Chat Panel -->
<div class="chat-panel">
    <div class="chat-header" id="chatHeader" style="display: none;">
        <button class="icon-circle-btn back-btn" onclick="closeMobileChat()">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="chat-header-clickable" onclick="toggleInfoPanel()">
            <div class="avatar avatar-sm" id="activeRoomAvatar">H</div>
            <div class="chat-header-info">
                <h3 id="activeRoomName">Chat</h3>
                <span id="activeRoomMeta"></span>
            </div>
        </div>
        <button class="icon-circle-btn" onclick="toggleInfoPanel()" title="Chat Info">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </button>
    </div>

    <div id="messages">
        <div class="empty-state">Select a chat to start messaging</div>
    </div>

    <div class="emoji-popover" id="emojiPopover">
        <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('🤣')">🤣</span>
        <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('🤔')">🤔</span>
        <span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('😡')">😡</span><span onclick="addEmoji('🔥')">🔥</span>
        <span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('👎')">👎</span>
        <span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('🤝')">🤝</span><span onclick="addEmoji('🎉')">🎉</span>
        <span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('⚡')">⚡</span>
        <span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('👀')">👀</span><span onclick="addEmoji('🫡')">🫡</span>
    </div>

    <div class="input-area" id="inputArea" style="display: none;"></div>
</div>

<!-- Right Info Panel -->
<div class="info-panel" id="infoPanel">
    <div class="info-header">
        <h3>Chat Info</h3>
        <button class="icon-circle-btn" onclick="toggleInfoPanel(false)">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
    <div class="info-body">
        <div class="avatar avatar-lg" id="infoAvatar">H</div>
        <div class="info-title" id="infoName">Name</div>
        <div class="info-sub" id="infoSub">Details</div>
        <div class="info-card">
            <small>Type</small>
            <div id="infoType">-</div>
        </div>
        <div class="info-card">
            <small>Admin / Creator</small>
            <div id="infoOwner">-</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let ws;
    let isSignup = false;
    let myName = localStorage.getItem("hg_username") || "";
    let myToken = localStorage.getItem("hg_token") || "";
    let rooms = [];
    let activeRoom = null;
    let currentFolder = "all";
    let createRoomType = "group";
    let unreadCounts = {};
    let lastSenderInChat = null;

    const avatarColors = [
        "linear-gradient(135deg, #ff885e, #e15241)",
        "linear-gradient(135deg, #ffcd6a, #f2994a)",
        "linear-gradient(135deg, #b694f9, #825ee4)",
        "linear-gradient(135deg, #9ad164, #5cb85c)",
        "linear-gradient(135deg, #64d2d6, #32a8b8)",
        "linear-gradient(135deg, #6ab2f2, #3a7bd5)",
        "linear-gradient(135deg, #f783ac, #d6336c)"
    ];

    function getAvatarBg(name) {
        let hash = 0;
        for (let i = 0; i < (name || "").length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return avatarColors[Math.abs(hash) % avatarColors.length];
    }

    function getNameColor(name) {
        const solid = ["#ff885e", "#ffcd6a", "#b694f9", "#9ad164", "#64d2d6", "#6ab2f2", "#f783ac"];
        let hash = 0;
        for (let i = 0; i < (name || "").length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return solid[Math.abs(hash) % solid.length];
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text || "";
        return div.innerHTML;
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
    }

    function toggleDrawer(open) {
        document.getElementById("drawer").classList.toggle("open", open);
        document.getElementById("drawerBackdrop").classList.toggle("open", open);
    }

    function toggleInfoPanel(force) {
        if (!activeRoom) return;
        const panel = document.getElementById("infoPanel");
        const shouldOpen = force !== undefined ? force : !panel.classList.contains("open");
        if (shouldOpen) {
            const av = document.getElementById("infoAvatar");
            av.innerText = activeRoom.name[0];
            av.style.background = getAvatarBg(activeRoom.name);
            document.getElementById("infoName").innerText = activeRoom.name;
            document.getElementById("infoSub").innerText =
                activeRoom.type === "dm" ? "Private Chat" : `${activeRoom.members} ${activeRoom.type === 'channel' ? 'subscribers' : 'members'}`;
            document.getElementById("infoType").innerText = activeRoom.type.toUpperCase();
            document.getElementById("infoOwner").innerText = "@" + activeRoom.owner;
        }
        panel.classList.toggle("open", shouldOpen);
    }

    function setFolder(folder, el) {
        currentFolder = folder;
        document.querySelectorAll(".folder-tab").forEach(t => t.classList.remove("active"));
        el.classList.add("active");
        if (!document.getElementById("searchInput").value.trim()) renderRoomList();
    }

    function toggleMode() {
        isSignup = !isSignup;
        document.getElementById("authTitle").innerText = isSignup ? "Create Account" : "Helligram";
        document.getElementById("authBtn").innerText = isSignup ? "Sign Up" : "Sign In";
        document.getElementById("toggleLabel").innerText = isSignup ? "Pehle se account hai? Sign In" : "Naya account banana hai? Sign Up";
        document.getElementById("authError").innerText = "";
    }

    async function submitAuth() {
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const errDiv = document.getElementById("authError");
        errDiv.innerText = "";
        const res = await fetch(isSignup ? "/api/signup" : "/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errDiv.innerText = data.detail || "Error"; return; }
        myName = data.username;
        myToken = data.token;
        localStorage.setItem("hg_username", myName);
        localStorage.setItem("hg_token", myToken);
        initApp();
    }

    async function initApp() {
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("drawerName").innerText = myName;
        document.getElementById("drawerHandle").innerText = "@" + myName;
        const dAv = document.getElementById("drawerAvatar");
        dAv.innerText = myName[0];
        dAv.style.background = getAvatarBg(myName);

        await loadRooms();
        connectWebSocket();
    }

    function connectWebSocket() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/${myToken}`);
        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "refresh_rooms") {
                await loadRooms();
            } else if (data.type === "new_message") {
                if (activeRoom && activeRoom.id === data.room_id) {
                    appendMessage(data);
                } else if (data.sender !== myName) {
                    unreadCounts[data.room_id] = (unreadCounts[data.room_id] || 0) + 1;
                }
                await loadRooms();
            }
        };
        ws.onclose = (e) => { if (e.code === 1008) logout(); };
    }

    async function loadRooms() {
        const res = await fetch("/api/rooms", { headers: { "x-auth-token": myToken } });
        if (res.status === 401) return logout();
        const data = await res.json();
        rooms = data.rooms || [];
        if (!document.getElementById("searchInput").value.trim()) renderRoomList();
    }

    function getTypeSvg(type) {
        if (type === "channel") return `<svg class="chat-type-icon" width="15" height="15" viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4z"/></svg>`;
        if (type === "group") return `<svg class="chat-type-icon" width="15" height="15" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`;
        return "";
    }

    function renderRoomList() {
        const list = document.getElementById("chatList");
        const filtered = currentFolder === "all" ? rooms : rooms.filter(r => r.type === currentFolder);
        if (filtered.length === 0) {
            list.innerHTML = `<div style="padding:36px 20px; text-align:center; color:#7f91a4; font-size:13.5px; line-height:1.5;">No chats in this folder.<br>Search a username or tap the pencil icon.</div>`;
            return;
        }
        list.innerHTML = filtered.map(r => {
            const unread = unreadCounts[r.id] || 0;
            return `
                <div class="chat-item ${activeRoom && activeRoom.id === r.id ? 'active' : ''}" onclick="openRoom(${r.id})">
                    <div class="avatar" style="background:${getAvatarBg(r.name)}">${escapeHtml(r.name[0])}</div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <div class="chat-name-wrap">
                                ${getTypeSvg(r.type)}
                                <span class="chat-name">${escapeHtml(r.name)}</span>
                            </div>
                            <span class="chat-time">${escapeHtml(r.last_time)}</span>
                        </div>
                        <div class="chat-bottom">
                            <div class="chat-preview">${escapeHtml(r.last_msg)}</div>
                            ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ""}
                        </div>
                    </div>
                </div>
            `;
        }).join("");
    }

    async function handleSearch() {
        const q = document.getElementById("searchInput").value.trim();
        if (!q) return renderRoomList();

        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { headers: { "x-auth-token": myToken } });
        const data = await res.json();
        let html = "";
        if (data.users.length > 0) {
            html += `<div class="section-label">Global Search • Users</div>`;
            html += data.users.map(u => `
                <div class="chat-item" onclick="startDM('${escapeHtml(u)}')">
                    <div class="avatar" style="background:${getAvatarBg(u)}">${escapeHtml(u[0])}</div>
                    <div class="chat-info"><div class="chat-name">${escapeHtml(u)}</div><div class="chat-preview">@${escapeHtml(u)}</div></div>
                </div>
            `).join("");
        }
        if (data.rooms.length > 0) {
            html += `<div class="section-label">Public Groups & Channels</div>`;
            html += data.rooms.map(r => `
                <div class="chat-item" onclick="joinRoom(${r.id})">
                    <div class="avatar" style="background:${getAvatarBg(r.name)}">${escapeHtml(r.name[0])}</div>
                    <div class="chat-info"><div class="chat-name">${escapeHtml(r.name)}</div><div class="chat-preview">Tap to join ${r.type}</div></div>
                </div>
            `).join("");
        }
        if (!html) html = `<div style="padding:30px; text-align:center; color:#7f91a4; font-size:13.5px;">No results found</div>`;
        document.getElementById("chatList").innerHTML = html;
    }

    async function startDM(target) {
        const res = await fetch("/api/dm", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-auth-token": myToken },
            body: JSON.stringify({ target_username: target })
        });
        const data = await res.json();
        document.getElementById("searchInput").value = "";
        await loadRooms();
        openRoom(data.room_id);
    }

    async function joinRoom(roomId) {
        await fetch(`/api/rooms/${roomId}/join`, { method: "POST", headers: { "x-auth-token": myToken } });
        document.getElementById("searchInput").value = "";
        await loadRooms();
        openRoom(roomId);
        showToast("Joined successfully");
    }

    async function openRoom(roomId) {
        activeRoom = rooms.find(r => r.id === roomId);
        if (!activeRoom) return;

        unreadCounts[roomId] = 0;
        lastSenderInChat = null;
        document.body.classList.add("chat-open");
        document.getElementById("chatHeader").style.display = "flex";
        document.getElementById("emojiPopover").classList.remove("open");
        toggleInfoPanel(false);

        const av = document.getElementById("activeRoomAvatar");
        av.innerText = activeRoom.name[0];
        av.style.background = getAvatarBg(activeRoom.name);

        document.getElementById("activeRoomName").innerText = activeRoom.name;
        document.getElementById("activeRoomMeta").innerText =
            activeRoom.type === "dm" ? "last seen recently" : `${activeRoom.members} ${activeRoom.type === 'channel' ? 'subscribers' : 'members'}`;

        const inputArea = document.getElementById("inputArea");
        inputArea.style.display = "flex";
        if (activeRoom.type === "channel" && activeRoom.owner !== myName) {
            inputArea.innerHTML = `<div class="readonly-bar">📢 Broadcast Channel • Only admin can post</div>`;
        } else {
            inputArea.innerHTML = `
                <button class="icon-circle-btn" onclick="toggleEmoji()" title="Emoji">
                    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                </button>
                <input type="text" id="msgInput" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()" title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            `;
        }

        const res = await fetch(`/api/rooms/${roomId}/messages`, { headers: { "x-auth-token": myToken } });
        const data = await res.json();
        const msgBox = document.getElementById("messages");
        msgBox.innerHTML = "";
        if (!data.messages || data.messages.length === 0) {
            msgBox.innerHTML = `<div class="empty-state">No messages here yet...</div>`;
        } else {
            msgBox.innerHTML = `<div class="date-pill">Chat History</div>`;
            data.messages.forEach(appendMessage);
        }
        renderRoomList();
    }

    function closeMobileChat() {
        document.body.classList.remove("chat-open");
        document.getElementById("emojiPopover").classList.remove("open");
        toggleInfoPanel(false);
    }

    function toggleEmoji() {
        document.getElementById("emojiPopover").classList.toggle("open");
    }

    function addEmoji(e) {
        const input = document.getElementById("msgInput");
        if (input) { input.value += e; input.focus(); }
    }

    function appendMessage(data) {
        const msgBox = document.getElementById("messages");
        const empty = msgBox.querySelector(".empty-state");
        if (empty) empty.remove();

        const isMe = data.sender === myName;
        const isGrouped = lastSenderInChat === data.sender;
        lastSenderInChat = data.sender;

        const div = document.createElement("div");
        div.className = `msg ${isMe ? "me" : "other"} ${isGrouped ? "grouped" : ""}`;
        const showName = !isMe && !isGrouped && activeRoom && activeRoom.type !== "dm";
        div.innerHTML = `
            ${showName ? `<div class="msg-user" style="color:${getNameColor(data.sender)}">${escapeHtml(data.sender)}</div>` : ""}
            <span class="msg-body">${escapeHtml(data.text)}</span>
            <span class="msg-meta">${escapeHtml(data.time)}${isMe ? " ✓✓" : ""}</span>
        `;
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById("msgInput");
        if (!input || !activeRoom) return;
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: "send_message", room_id: activeRoom.id, text }));
            input.value = "";
            document.getElementById("emojiPopover").classList.remove("open");
        }
    }

    function openCreateModal(type) {
        createRoomType = type;
        document.getElementById("createModalTitle").innerText = type === "group" ? "New Group" : "New Channel";
        document.getElementById("newRoomName").value = "";
        document.getElementById("createModal").style.display = "flex";
        setTimeout(() => document.getElementById("newRoomName").focus(), 50);
    }

    function closeCreateModal() {
        document.getElementById("createModal").style.display = "none";
    }

    async function confirmCreateRoom() {
        const name = document.getElementById("newRoomName").value.trim();
        if (name.length < 2) return showToast("Naam kam az kam 2 characters ka ho");
        const res = await fetch("/api/rooms/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-auth-token": myToken },
            body: JSON.stringify({ name, type: createRoomType })
        });
        const data = await res.json();
        closeCreateModal();
        await loadRooms();
        openRoom(data.room_id);
        showToast(createRoomType === "group" ? "Group created!" : "Channel created!");
    }

    function logout() {
        localStorage.removeItem("hg_username");
        localStorage.removeItem("hg_token");
        if (ws) ws.close();
        location.reload();
    }

    if (myToken && myName) initApp();
</script>
</body>
</html>
