<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helligram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0e1621; color: #f5f5f5; height: 100vh; overflow: hidden; display: flex; }

        /* Sidebar (Left Panel) */
        .sidebar { width: 320px; background: #17212b; border-right: 1px solid #0b1017; display: flex; flex-direction: column; height: 100vh; }
        .sidebar-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0b1017; }
        .sidebar-header h2 { font-size: 18px; color: #6ab2f2; }
        .icon-btn { background: #242f3d; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .logout-btn { color: #ff6b6b; }

        .search-box { padding: 10px 12px; border-bottom: 1px solid #0b1017; }
        .search-box input { width: 100%; background: #242f3d; border: none; color: #fff; padding: 9px 14px; border-radius: 18px; font-size: 14px; outline: none; }

        .quick-actions { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #0b1017; }
        .quick-actions button { flex: 1; background: #2b5278; color: #fff; border: none; padding: 7px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #121b24; }
        .chat-item:hover, .chat-item.active { background: #2b5278; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: #5288c1; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; flex-shrink: 0; text-transform: uppercase; }
        .avatar.group { background: #2e7d32; }
        .avatar.channel { background: #8e24aa; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-top { display: flex; justify-content: space-between; align-items: center; }
        .chat-name { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 11px; color: #8c9ba5; }
        .chat-preview { font-size: 12px; color: #8c9ba5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .section-label { padding: 6px 14px; font-size: 11px; color: #6ab2f2; background: #121b24; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Chat Window (Right Panel) */
        .chat-panel { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0e1621; }
        .chat-header { background: #17212b; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0b1017; }
        .back-btn { display: none; background: none; border: none; color: #6ab2f2; font-size: 20px; cursor: pointer; padding-right: 4px; }
        .chat-header-info h3 { font-size: 16px; }
        .chat-header-info span { font-size: 12px; color: #8c9ba5; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .empty-state { flex: 1; display: flex; justify-content: center; align-items: center; color: #8c9ba5; font-size: 15px; text-align: center; padding: 20px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #182533; border-bottom-left-radius: 2px; }
        .msg-user { font-size: 12px; font-weight: bold; color: #6ab2f2; margin-bottom: 2px; }
        .msg-time { font-size: 10px; color: #8c9ba5; text-align: right; margin-top: 4px; }

        .input-area { background: #17212b; padding: 10px 15px; display: flex; gap: 10px; align-items: center; }
        #msgInput { flex: 1; background: #242f3d; border: none; color: #fff; padding: 11px 15px; border-radius: 20px; font-size: 15px; outline: none; }
        #sendBtn { background: #5288c1; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .readonly-bar { width: 100%; text-align: center; color: #8c9ba5; font-size: 13px; padding: 8px; }

        /* Auth & Create Modals */
        .overlay { position: fixed; inset: 0; background: rgba(14, 22, 33, 0.94); display: flex; justify-content: center; align-items: center; z-index: 20; }
        .modal-box { background: #17212b; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        .modal-box h2 { margin-bottom: 16px; color: #6ab2f2; }
        .modal-box input { width: 100%; padding: 11px; margin-bottom: 12px; border-radius: 8px; border: none; background: #242f3d; color: #fff; font-size: 14px; outline: none; }
        .primary-btn { width: 100%; padding: 11px; border-radius: 8px; border: none; background: #5288c1; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: #242f3d; color: #ccc; margin-top: 8px; }
        .toggle-text { margin-top: 14px; font-size: 13px; color: #8c9ba5; cursor: pointer; }
        .toggle-text span { color: #6ab2f2; font-weight: bold; }
        .err-text { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 16px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .chat-panel { display: none; width: 100%; }
            body.chat-open .sidebar { display: none; }
            body.chat-open .chat-panel { display: flex; }
            .back-btn { display: inline-block; }
        }
    </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay" class="overlay">
    <div class="modal-box">
        <h2 id="authTitle">Helligram Login</h2>
        <div id="authError" class="err-text"></div>
        <input type="text" id="usernameInput" placeholder="Username" maxlength="20">
        <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') submitAuth()">
        <button id="authBtn" class="primary-btn" onclick="submitAuth()">Login</button>
        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggleLabel">Naya account banana hai? Sign Up</span>
        </div>
    </div>
</div>

<!-- Create Group/Channel Modal -->
<div id="createModal" class="overlay" style="display: none;">
    <div class="modal-box">
        <h2 id="createModalTitle">New Group</h2>
        <input type="text" id="newRoomName" placeholder="Naam likhein...">
        <button class="primary-btn" onclick="confirmCreateRoom()">Create</button>
        <button class="primary-btn cancel-btn" onclick="closeCreateModal()">Cancel</button>
    </div>
</div>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <h2>Helligram</h2>
        <button class="icon-btn logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search users, groups, channels..." oninput="handleSearch()">
    </div>
    <div class="quick-actions">
        <button onclick="openCreateModal('group')">+ Group</button>
        <button onclick="openCreateModal('channel')">+ Channel</button>
    </div>
    <div class="chat-list" id="chatList"></div>
</div>

<!-- Right Chat Panel -->
<div class="chat-panel">
    <div class="chat-header" id="chatHeader" style="display: none;">
        <button class="back-btn" onclick="closeMobileChat()">←</button>
        <div class="chat-header-info">
            <h3 id="activeRoomName">Chat</h3>
            <span id="activeRoomMeta"></span>
        </div>
    </div>
    <div id="messages">
        <div class="empty-state">Kisi chat ko select karein ya upar search karke naya user/group dhundein.</div>
    </div>
    <div class="input-area" id="inputArea" style="display: none;">
        <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let ws;
    let isSignup = false;
    let myName = localStorage.getItem("hg_username") || "";
    let myToken = localStorage.getItem("hg_token") || "";
    let rooms = [];
    let activeRoom = null;
    let createRoomType = "group";

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text || "";
        return div.innerHTML;
    }

    function toggleMode() {
        isSignup = !isSignup;
        document.getElementById("authTitle").innerText = isSignup ? "Helligram Sign Up" : "Helligram Login";
        document.getElementById("authBtn").innerText = isSignup ? "Create Account" : "Login";
        document.getElementById("toggleLabel").innerText = isSignup ? "Pehle se account hai? Login" : "Naya account banana hai? Sign Up";
        document.getElementById("authError").innerText = "";
    }

    async function submitAuth() {
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const errDiv = document.getElementById("authError");
        errDiv.innerText = "";
        const res = await fetch(isSignup ? "/api/signup" : "/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errDiv.innerText = data.detail || "Error"; return; }
        myName = data.username;
        myToken = data.token;
        localStorage.setItem("hg_username", myName);
        localStorage.setItem("hg_token", myToken);
        initApp();
    }

    async function initApp() {
        document.getElementById("authOverlay").style.display = "none";
        await loadRooms();
        connectWebSocket();
    }

    function connectWebSocket() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/${myToken}`);
        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "refresh_rooms") {
                await loadRooms();
            } else if (data.type === "new_message") {
                if (activeRoom && activeRoom.id === data.room_id) {
                    appendMessage(data);
                }
                await loadRooms();
            }
        };
        ws.onclose = (e) => { if (e.code === 1008) logout(); };
    }

    async function loadRooms() {
        const res = await fetch("/api/rooms", { headers: { "x-auth-token": myToken } });
        if (res.status === 401) return logout();
        const data = await res.json();
        rooms = data.rooms || [];
        if (!document.getElementById("searchInput").value.trim()) {
            renderRoomList();
        }
    }

    function renderRoomList() {
        const list = document.getElementById("chatList");
        if (rooms.length === 0) {
            list.innerHTML = `<div style="padding:20px; text-align:center; color:#8c9ba5; font-size:13px;">Abhi koi chat nahi. Upar search karein ya Group/Channel banayein.</div>`;
            return;
        }
        list.innerHTML = rooms.map(r => `
            <div class="chat-item ${activeRoom && activeRoom.id === r.id ? 'active' : ''}" onclick="openRoom(${r.id})">
                <div class="avatar ${r.type}">${escapeHtml(r.name[0])}</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <span class="chat-name">${r.type === 'channel' ? '📢 ' : (r.type === 'group' ? '👥 ' : '')}${escapeHtml(r.name)}</span>
                        <span class="chat-time">${escapeHtml(r.last_time)}</span>
                    </div>
                    <div class="chat-preview">${escapeHtml(r.last_msg)}</div>
                </div>
            </div>
        `).join("");
    }

    async function handleSearch() {
        const q = document.getElementById("searchInput").value.trim();
        if (!q) return renderRoomList();

        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { headers: { "x-auth-token": myToken } });
        const data = await res.json();
        let html = "";
        if (data.users.length > 0) {
            html += `<div class="section-label">Users (Private Chat)</div>`;
            html += data.users.map(u => `
                <div class="chat-item" onclick="startDM('${escapeHtml(u)}')">
                    <div class="avatar">${escapeHtml(u[0])}</div>
                    <div class="chat-info"><div class="chat-name">@${escapeHtml(u)}</div><div class="chat-preview">Tap to message</div></div>
                </div>
            `).join("");
        }
        if (data.rooms.length > 0) {
            html += `<div class="section-label">Public Groups & Channels</div>`;
            html += data.rooms.map(r => `
                <div class="chat-item" onclick="joinRoom(${r.id})">
                    <div class="avatar ${r.type}">${escapeHtml(r.name[0])}</div>
                    <div class="chat-info"><div class="chat-name">${escapeHtml(r.name)}</div><div class="chat-preview">Tap to join ${r.type}</div></div>
                </div>
            `).join("");
        }
        if (!html) html = `<div style="padding:20px; text-align:center; color:#8c9ba5; font-size:13px;">Koi user ya group nahi mila.</div>`;
        document.getElementById("chatList").innerHTML = html;
    }

    async function startDM(target) {
        const res = await fetch("/api/dm", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-auth-token": myToken },
            body: JSON.stringify({ target_username: target })
        });
        const data = await res.json();
        document.getElementById("searchInput").value = "";
        await loadRooms();
        openRoom(data.room_id);
    }

    async function joinRoom(roomId) {
        await fetch(`/api/rooms/${roomId}/join`, { method: "POST", headers: { "x-auth-token": myToken } });
        document.getElementById("searchInput").value = "";
        await loadRooms();
        openRoom(roomId);
    }

    async function openRoom(roomId) {
        activeRoom = rooms.find(r => r.id === roomId);
        if (!activeRoom) return;

        document.body.classList.add("chat-open");
        document.getElementById("chatHeader").style.display = "flex";
        document.getElementById("activeRoomName").innerText = activeRoom.name;
        document.getElementById("activeRoomMeta").innerText =
            activeRoom.type === "dm" ? "Private Chat" : `${activeRoom.type.toUpperCase()} • ${activeRoom.members} members`;

        const inputArea = document.getElementById("inputArea");
        inputArea.style.display = "flex";
        if (activeRoom.type === "channel" && activeRoom.owner !== myName) {
            inputArea.innerHTML = `<div class="readonly-bar">📢 Is channel mein sirf Admin post kar sakta hai.</div>`;
        } else {
            inputArea.innerHTML = `
                <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            `;
        }

        const res = await fetch(`/api/rooms/${roomId}/messages`, { headers: { "x-auth-token": myToken } });
        const data = await res.json();
        const msgBox = document.getElementById("messages");
        msgBox.innerHTML = "";
        (data.messages || []).forEach(appendMessage);
        renderRoomList();
    }

    function closeMobileChat() {
        document.body.classList.remove("chat-open");
    }

    function appendMessage(data) {
        const msgBox = document.getElementById("messages");
        const isMe = data.sender === myName;
        const div = document.createElement("div");
        div.className = `msg ${isMe ? "me" : "other"}`;
        div.innerHTML = `
            ${!isMe && activeRoom && activeRoom.type !== "dm" ? `<div class="msg-user">${escapeHtml(data.sender)}</div>` : ""}
            <div>${escapeHtml(data.text)}</div>
            <div class="msg-time">${escapeHtml(data.time)}</div>
        `;
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById("msgInput");
        if (!input || !activeRoom) return;
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: "send_message", room_id: activeRoom.id, text }));
            input.value = "";
        }
    }

    function openCreateModal(type) {
        createRoomType = type;
        document.getElementById("createModalTitle").innerText = type === "group" ? "New Group" : "New Channel";
        document.getElementById("newRoomName").value = "";
        document.getElementById("createModal").style.display = "flex";
    }

    function closeCreateModal() {
        document.getElementById("createModal").style.display = "none";
    }

    async function confirmCreateRoom() {
        const name = document.getElementById("newRoomName").value.trim();
        if (name.length < 2) return alert("Naam kam az kam 2 characters ka ho.");
        const res = await fetch("/api/rooms/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-auth-token": myToken },
            body: JSON.stringify({ name, type: createRoomType })
        });
        const data = await res.json();
        closeCreateModal();
        await loadRooms();
        openRoom(data.room_id);
    }

    function logout() {
        localStorage.removeItem("hg_username");
        localStorage.removeItem("hg_token");
        if (ws) ws.close();
        location.reload();
    }

    if (myToken && myName) initApp();
</script>
</body>
</html>
